# pgvector image is used so the vector extension is available later without swapping images
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bulwark
      POSTGRES_PASSWORD: bulwark
      POSTGRES_DB: bulwark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Layer 2 DeBERTa injection classifier. The proxy calls it at http://localhost:8000
  # when BULWARK_LAYER2_URL points here; if it's down, Layer 2 fails open.
  classifier:
    build: ./classifier
    environment:
      MODEL_ID: protectai/deberta-v3-base-prompt-injection
    ports:
      - "8000:8000"

volumes:
  pgdata:
