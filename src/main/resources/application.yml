server:
  # Railway injects PORT; default to 8080 for local dev.
  port: ${PORT:8080}

bulwark:
  upstream:
    # Any OpenAI-compatible provider. Override with UPSTREAM_BASE_URL if needed.
    base-url: ${UPSTREAM_BASE_URL:https://api.anthropic.com}
    # Supplied via environment; never commit a real key.
    api-key: ${ANTHROPIC_API_KEY:}
  screening:
    # block  = refuse on detection (prompt never reaches the model)
    # flag   = log the detection and forward anyway (used to measure false positives)
    mode: ${BULWARK_SCREENING_MODE:block}
    # What to do when a layer can't run (sidecar or judge unavailable):
    # open   = fail open, forward the request and record the gap
    # closed = fail closed, refuse because the input couldn't be fully screened
    on-degrade: ${BULWARK_ON_DEGRADE:open}
    # Request fields carrying retrieved documents or tool output. Their text is screened as
    # untrusted content (indirect injection), not just the user message. Add your app's own
    # field names as needed; empty disables this.
    indirect-fields: ${BULWARK_INDIRECT_FIELDS:documents,context,sources,retrieved,tool_results}
  layer2:
    # DeBERTa classifier sidecar. Leave the URL unset to disable Layer 2 (Layer 1 still runs);
    # when set but unreachable, Layer 2 fails open and records the gap. For local dev with the
    # docker-compose sidecar, set BULWARK_LAYER2_URL=http://localhost:8000.
    url: ${BULWARK_LAYER2_URL:}
    # Injection probability at or above which the input is treated as an injection.
    threshold: ${BULWARK_LAYER2_THRESHOLD:0.5}
    # Connect/read timeout per classify call, in milliseconds.
    timeout-millis: ${BULWARK_LAYER2_TIMEOUT_MS:800}
  layer3:
    # LLM judge (optional, off by default). It runs only on inputs the cheaper layers pass but
    # can't clear, and calls a cheap Claude model directly.
    enabled: ${BULWARK_LAYER3_ENABLED:false}
    # Anthropic API key for the judge
    api-key: ${ANTHROPIC_API_KEY:}
    # The Claude model the judge reasons with. Override it at runtime with BULWARK_LAYER3_MODEL (e.g. claude-sonnet-5)
    model: ${BULWARK_LAYER3_MODEL:claude-sonnet-5}
    # Layer 2 score at or above which a passed input is 'uncertain' and escalated to the judge;
    # inputs the classifier scored below this are confidently clean and skip the judge.
    uncertainty-floor: ${BULWARK_LAYER3_FLOOR:0.2}
    # Per-call timeout for the judge, in milliseconds; on timeout Layer 3 fails open.
    timeout-millis: ${BULWARK_LAYER3_TIMEOUT_MS:4000}
  # Audit log (optional) is configured purely by environment so that unset means the
  # property is truly absent - which is what switches the audit DataSource off. Set these
  # to enable append-only persistence of decisions to Postgres
  #   BULWARK_AUDIT_JDBC_URL       jdbc:postgresql://host:5432/bulwark
  #   BULWARK_AUDIT_USERNAME
  #   BULWARK_AUDIT_PASSWORD

management:
  endpoints:
    web:
      exposure:
        # Grafana Cloud scrapes /actuator/prometheus.
        include: health,info,prometheus
  health:
    # The audit database is optional; don't let an unreachable Postgres flip health to DOWN
    db:
      enabled: false
