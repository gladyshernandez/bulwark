server:
  # Railway injects PORT; default to 8080 for local dev.
  port: ${PORT:8080}

bulwark:
  upstream:
    # Any OpenAI-compatible provider. Override with UPSTREAM_BASE_URL if needed.
    base-url: ${UPSTREAM_BASE_URL:https://api.anthropic.com}
    # Supplied via environment; never commit a real key.
    api-key: ${ANTHROPIC_API_KEY:}
  screening:
    # block  = refuse on detection (prompt never reaches the model)
    # flag   = log the detection and forward anyway (used to measure false positives)
    mode: ${BULWARK_SCREENING_MODE:block}
  layer2:
    # DeBERTa classifier sidecar. Leave the URL unset to disable Layer 2 (Layer 1 still runs);
    # when set but unreachable, Layer 2 fails open and records the gap. For local dev with the
    # docker-compose sidecar, set BULWARK_LAYER2_URL=http://localhost:8000.
    url: ${BULWARK_LAYER2_URL:}
    # Injection probability at or above which the input is treated as an injection.
    threshold: ${BULWARK_LAYER2_THRESHOLD:0.5}
    # Connect/read timeout per classify call, in milliseconds.
    timeout-millis: ${BULWARK_LAYER2_TIMEOUT_MS:800}
  # Audit log (optional) is configured purely by environment so that unset means the
  # property is truly absent - which is what switches the audit DataSource off. Set these
  # to enable append-only persistence of decisions to Postgres
  #   BULWARK_AUDIT_JDBC_URL       jdbc:postgresql://host:5432/bulwark
  #   BULWARK_AUDIT_DB_USER
  #   BULWARK_AUDIT_DB_PASSWORD

management:
  endpoints:
    web:
      exposure:
        # Grafana Cloud scrapes /actuator/prometheus.
        include: health,info,prometheus
  health:
    # The audit database is optional; don't let an unreachable Postgres flip health to DOWN
    db:
      enabled: false
